[tool.ruff]
line-length = 320
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["simulation", "web"]
omit = [
    "tests/*",
    "env/*",
    "env_old/*",
    # Streamlit page modules and the app entry point.  These are
    # imperative top-level scripts loaded by Streamlit's page-loader
    # at runtime; their executable code only runs in a real Streamlit
    # context with `st.session_state`, `st.rerun()`, etc.  Per
    # Constitution Principle VI v1.3.0, UI entry points are an
    # acceptable category for coverage skip.  They are verified via
    # the manual Streamlit smoke check (Quality Gate 5), not unit tests.
    "web/views/*.py",
    "web/app.py",
]

[tool.coverage.report]
# Per Constitution Principle VI v1.3.0 (commit 3c49b3c), coverage must
# be 100% on every file under simulation/ and web/.  Pragma skips are
# allowed with a one-line justification comment matching one of four
# categories (UI entry point / defensive / abstract method / re-raise).
# The pragma-audit meta-test at tests/test_coverage_pragma_audit.py
# enforces the justification requirement.
#
# ``fail_under = 100`` (added 2026-05-28) makes the coverage report
# itself error when overall coverage drops below 100% — automated
# enforcement of Principle VI, no longer relying on the orchestrator
# remembering to eyeball the report.  To run the gate explicitly:
# ``env/bin/pytest tests/ --cov`` (exit code 2 if any non-pragma'd
# line is uncovered).  This was added after the Bayushi run merged
# at 93% coverage on simulation/schools/bayushi_school.py — a clear
# Principle VI violation that no automated check caught.
exclude_lines = [
    "pragma: no cover",
]
show_missing = true
fail_under = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["simulation", "web", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["yaml", "streamlit", "streamlit.*"]
ignore_missing_imports = true
